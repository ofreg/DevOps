stages:
  - lint
  - test
  - build

lint:
  stage: lint
  image: python:3.11
  script:
    - pip install flake8
    - flake8 . --count --statistics
  allow_failure: false

test:
  stage: test
  image: python:3.11
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - pytest --junitxml=report.xml --cov=app --cov-fail-under=50
  artifacts:
    paths:
      - report.xml
      - htmlcov/
    reports:
      junit: report.xml
    expire_in: 1 week

build:
  stage: build
  image: python:3.11
  script:
    - echo "Building package..."
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
