name: Python CI

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Run flake8
        run: flake8 . --count --statistics

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest --junitxml=report.xml --cov=app --cov-fail-under=50 --cov-report=xml --cov-report=html
      - name: Upload Test Report
        uses: actions/upload-artifact@v4

        with:
          name: test-report
          path: |
            report.xml
            htmlcov/

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main1'
    steps:
      - uses: actions/checkout@v3
      - name: Build package
        run: echo "Build step running only on main branch"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4

        with:
          name: build
          path: dist/
